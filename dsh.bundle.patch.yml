# Configure paths, Controller access and the local provider in a private profile.
# Module names below are relative to this ROOT bundle, including preset children.
# Enable the outer preset AND its managed local-genai child after configuration.
- insert:
    - id: local-genai-gateway
      name: ./apps/dsh-plugins/local-genai/gateway.mjs
      disabled: true
      config:
        runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
        controllerUrl: http://127.0.0.1:3090
        tokenFile: data/controller/dsh-token
    - id: preset-local-image
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: local-image
        name: Media Studio
        description: Produce, deliver and review local media with registered ComfyUI workflows.
        order: 0
        plugins:
          - id: local-genai
            name: ./apps/dsh-plugins/local-genai/index.mjs
            disabled: true
            config:
              runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
              controllerUrl: http://127.0.0.1:3090
              tokenFile: data/controller/dsh-token
              role: studio
          - id: local-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: media-studio-compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: media-studio-compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.625
                  headroomTokens: 4096
                  maxTokens: 4096
                  retainTokens: 1024
                  summarizationProvider: local-strata
                  summarizationModel: strata-core
          - id: media-studio-skills
            name: cordis:group
            group: true
            isolate:
              skills: true
            config:
              - id: media-studio-skill-registry
                name: '@deepseek-ai/dsh-skill'
              - id: media-studio-skill-source
                name: ./apps/dsh-plugins/local-genai/skills.mjs
              - id: media-studio-skill-tool
                name: '@deepseek-ai/dsh-tool-skill'
                config:
                  catalogDescriptionMaxLength: 220
    - id: media-results
      name: ./apps/dsh-plugins/media-results/index.mjs
      disabled: true
      config:
        runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
    - id: preset-comfy-maintenance
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: comfy-maintenance
        name: ComfyUI Maintenance
        description: Inspect local nodes and edit or statically validate ComfyUI workflow drafts.
        order: 10
        plugins:
          - id: comfy-maintenance-persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                You are ComfyUI Maintenance. Use the scoped ComfyUI maintenance tools to find installed local node classes, edit an existing UI workflow as a draft, and validate a workflow without running it. Answer in the user's language.
                Require a workflow path relative to ComfyUI Workflows or an existing draft ID. For edits use the exact node IDs, fields or ports. Set, connect or disconnect only the requested settings or links. Keep the original and apply further edits to the last returned draft ID.
                After an edit, validate the returned draft. Report the draft ID, changes, validation result, and relevant errors or warnings. Static validation does not establish GPU fit, execution, or output quality.
                If a request needs a new graph, added or removed nodes, models, custom nodes, GPU trials or managed catalog registration, report the missing capability and the next step for the user or an external maintainer. Do not run, install, download, publish or alter Controller settings. For production, tell the user to choose Media Studio and use the registered workflow and operation.
          - id: comfy-maintenance-mcp
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              transport: stdio
              serverName: comfy_maintenance
              command: ABSOLUTE_PYTHON_EXECUTABLE
              args: [ABSOLUTE_SERVER_SCRIPT]
              startupTimeoutMs: 15000
              toolCallTimeoutMs: 35000
              failOnStartupError: true
    - id: studio-controls
      name: ./apps/dsh-plugins/studio-controls/index.mjs
      disabled: true
      config:
        runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
    - id: studio-preset
      name: ./apps/dsh-plugins/studio-preset/index.mjs
      disabled: true
    - id: studio-monitor
      name: ./apps/dsh-plugins/studio-monitor/index.mjs
      disabled: true
      config:
        runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
    - id: studio-services
      name: ./apps/dsh-plugins/studio-services/index.mjs
      disabled: true
      config:
        runtimeRoot: ABSOLUTE_PRIVATE_RUNTIME_ROOT
