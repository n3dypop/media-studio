name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Run tests with a canonical temporary directory
        shell: pwsh
        run: |
          $scratch = Join-Path (Split-Path -Parent $env:GITHUB_WORKSPACE) ('media-studio-test-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $scratch | Out-Null
          $canonical = node -e "console.log(require('node:fs').realpathSync(process.argv[1]))" $scratch
          if ($LASTEXITCODE -ne 0 -or -not $canonical) { throw 'Test directory could not be resolved' }
          $env:TEMP = $canonical
          $env:TMP = $canonical
          $env:TMPDIR = $canonical
          npm test
          exit $LASTEXITCODE
