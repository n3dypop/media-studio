# Illustrative override of the native llm-pi-ai entry. Do not apply placeholders.
# The adapter is already part of the native web profile: do not insert a duplicate.
# Keep these route IDs; display labels can identify your actual installed model.
- id: llm-pi-ai
  config:
    providers:
      local-strata:
        displayName: Strata
        api: openai-completions
        baseURL: http://127.0.0.1:3090/v1
        apiKeyEnv: LOCAL_GENAI_DSH_TOKEN
        models:
          - id: strata-core
            name: ACTUAL_INSTALLED_CORE_MODEL_DISPLAY_NAME
            contextWindow: VERIFIED_CONTEXT_WINDOW_TOKENS
            maxTokens: VERIFIED_MODEL_OUTPUT_CAPACITY_TOKENS
            input:
              - text
              - image
# Reserve space before the adapter shortens the answer on local models.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: local-strata
        model: strata-core
        thresholdRatio: 0.625
        headroomTokens: 4096
        maxTokens: 4096
        retainTokens: 1024
